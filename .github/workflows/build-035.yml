name: PS2 Emulator Build 089 (IOP decoder diagnostics)

on:
  workflow_dispatch:
  push:
    paths:
      - 'PS2-PS3-Bringup-035-SOURCE.zip'
      - '.github/workflows/build-035.yml'
      - 'tools/restore-build034-iop-test.py'
      - 'tools/build037_auto_reports.py'
      - 'tools/build038_preserve_reports.py'
      - 'tools/build039_dve_fault_diagnostics.py'
      - 'tools/build040_dve_mode43.py'
      - 'tools/build040_dve_regression.cpp'
      - 'tools/build041_gif_fifo.py'
      - 'tools/build042_dmac_ctrl.py'
      - 'tools/build043_ee_timers.py'
      - 'tools/build044_vif0_dma_probe.py'
      - 'tools/build045_ee_dmac.py'
      - 'tools/build046_vu0_cop2.py'
      - 'tools/build047_vu0_viswr_zero.py'
      - 'tools/build048_vu0_qmfc2.py'
      - 'tools/build049_vu_macro_decode.py'
      - 'tools/build050_vsub_vf0.py'
      - 'tools/build051_vu_vsqi.py'
      - 'tools/build052_vu_vsqi_wrap.py'
      - 'tools/build053_vu_qmtc2.py'
      - 'tools/build054_vu1_data.py'
      - 'tools/build055_vu1_micro.py'
      - 'tools/build056_vif1_regs.py'
      - 'tools/build057_vif1_fifo.py'
      - 'tools/build058_f510_probe.py'
      - 'tools/build085_sif_poll.py'
      - 'tools/build086_iop_bootstrap.py'
      - 'tools/build087_iop_cop0.py'
      - 'tools/build088_iop_sw.py'
      - 'tools/build089_iop_decode.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd make python3 libelf-dev

      - name: Verify and extract PS3DEV toolchains
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolchains"
          cd "$RUNNER_TEMP/toolchains"
          BASE="https://github.com/khant735/PS3-PSU-Manager/releases/download/ps3dev-verified-toolchain"
          # Prefer public release download endpoints (redirect to release asset CDN).
          # The GitHub REST assets API returned repeated 503/504 errors in Build 072.
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 -o ps3dev_psl1ght_full_toolchain.tar.zst "$BASE/ps3dev_psl1ght_full_toolchain.tar.zst"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 -o ps3dev_ppu_compiler_cgcomp.tar.zst "$BASE/ps3dev_ppu_compiler_cgcomp.tar.zst"
          test "$(stat -c%s ps3dev_psl1ght_full_toolchain.tar.zst)" -eq 162112314
          test "$(stat -c%s ps3dev_ppu_compiler_cgcomp.tar.zst)" -eq 88747654
          echo "034747ab869247ffed67b50a8776779bb7ac65fe1a9ebc0a58a0058aab6f8710  ps3dev_psl1ght_full_toolchain.tar.zst" | sha256sum -c -
          echo "95f8f0a463c0a68177ada128273ec026481ec0b31fce3481c74e0eccb7e12e88  ps3dev_ppu_compiler_cgcomp.tar.zst" | sha256sum -c -
          for f in *.tar.zst; do
            echo "Archive layout for $f:"
            tar --zstd -tf "$f" | head -30 || true
          done
          mkdir -p "$RUNNER_TEMP/ps3toolchain"
          for f in *.tar.zst; do tar --zstd -xf "$f" -C "$RUNNER_TEMP/ps3toolchain"; done
          echo "Toolchain executables:"
          find "$RUNNER_TEMP/ps3toolchain" -type f \( -name 'ppu-gcc' -o -name 'ppu-g++' -o -name 'make_pkg' -o -name 'make_self_npdrm' \) -print
          echo "PSL1GHT rules:"
          find "$RUNNER_TEMP/ps3toolchain" -name ppu_rules -print

      - name: Unpack Build 035 source
        shell: bash
        run: |
          set -euo pipefail
          test -s PS2-PS3-Bringup-035-SOURCE.zip || { echo "::error::Upload PS2-PS3-Bringup-035-SOURCE.zip to the repository root"; exit 1; }
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile("PS2-PS3-Bringup-035-SOURCE.zip") as z:
              z.extractall("src")
          PY
          test -f src/PS2-PS3-Bringup-035-SOURCE/Makefile
          python3 tools/restore-build034-iop-test.py
          python3 tools/build037_auto_reports.py
          python3 tools/build038_preserve_reports.py
          python3 tools/build039_dve_fault_diagnostics.py
          python3 tools/build040_dve_mode43.py
          g++ -std=c++11 -Wall -Wextra -Werror -Isrc/PS2-PS3-Bringup-035-SOURCE/include tools/build040_dve_regression.cpp -o /tmp/build040_dve_regression
          /tmp/build040_dve_regression
          python3 tools/build041_gif_fifo.py
          python3 tools/build042_dmac_ctrl.py
          python3 tools/build043_ee_timers.py
          python3 tools/build044_vif0_dma_probe.py
          python3 tools/build045_ee_dmac.py
          python3 tools/build046_vu0_cop2.py
          python3 tools/build047_vu0_viswr_zero.py
          python3 tools/build048_vu0_qmfc2.py
          python3 tools/build049_vu_macro_decode.py
          python3 tools/build050_vsub_vf0.py
          python3 tools/build051_vu_vsqi.py
          python3 tools/build052_vu_vsqi_wrap.py
          python3 tools/build053_vu_qmtc2.py
          python3 tools/build054_vu1_data.py
          python3 tools/build055_vu1_micro.py
          python3 tools/build056_vif1_regs.py
          python3 tools/build057_vif1_fifo.py
          python3 tools/build058_f510_probe.py
          python3 tools/build059_memory_inventory.py
          python3 tools/build060_vu0_memory.py
          python3 tools/build061_vu0_vsub_vf2.py
          python3 tools/build062_vu0_vsub_decode.py
          python3 tools/build063_vu0_viadd.py
          python3 tools/build064_vif0_regs.py
          python3 tools/build065_vif0_fifo.py
          python3 tools/build066_ipu_regs.py
          python3 tools/build067_ipu_fifo.py
          python3 tools/build068_fpu_add.py
          python3 tools/build069_fpu_control.py
          python3 tools/build070_cache_op14.py
          python3 tools/build071_cache_op0c.py
          python3 tools/build072_mmio_3800_diag.py
          python3 tools/build073_iop_debug3800_probe.py
          python3 tools/build074_ee_ldl.py
          python3 tools/build075_ee_ldr.py
          python3 tools/test075_ldl_ldr.py
          python3 tools/build076_ee_sdl_sdr.py
          python3 tools/test076_sdl_sdr.py
          python3 tools/build077_sif_ctrl.py
          python3 tools/build078_sif_physical.py
          python3 tools/build079_sif_alias.py
          python3 tools/build080_sif_f260.py
          python3 tools/build081_sif_f2xx.py
          python3 tools/build082_sif_f230.py
          python3 tools/build083_bios_watchdog.py
          python3 tools/build084_ee_ips.py
          python3 tools/build085_sif_poll.py
          python3 tools/build086_iop_bootstrap.py
          python3 tools/build087_iop_cop0.py
          python3 tools/build088_iop_sw.py
          python3 tools/build089_iop_decode.py
          python3 -m py_compile tools/build087_iop_cop0.py tools/build088_iop_sw.py tools/build089_iop_decode.py
          grep -nE 'run_batch|log_stop|render_emu|instructions|ui_now_us|ips_' src/PS2-PS3-Bringup-035-SOURCE/source/emu_ui.inc | tail -85
          python3 -m py_compile tools/build084_ee_ips.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/PS2-PS3-Bringup-035-SOURCE/source/emu_core.cpp')
          s=p.read_text().splitlines()
          for i,line in enumerate(s):
            if any(k in line for k in ('switch(op','switch (op','case 0x12','case 18:','case 0x10','case 16:','Unsupported instruction','Primary instruction not implemented')):
              print('COP2_INSPECT',i+1,repr(line[:220]))
              for j in range(max(0,i-3),min(len(s),i+7)):print('COP2_CONTEXT',j+1,s[j][:240])
          PY
          (cd src && zip -qr "$GITHUB_WORKSPACE/PS2-PS3-Bringup-089-SOURCE.zip" PS2-PS3-Bringup-035-SOURCE)
          echo 'Recovered Build 034 register test applied to Build 035 source tree'

      - name: Configure and compile
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ps3toolchain"
          RULES="$(find "$ROOT" -type f -name ppu_rules -print -quit)"
          test -n "$RULES" || { echo "::error::PSL1GHT ppu_rules missing"; exit 1; }
          export PS3DEV="$ROOT/ps3dev"
          export PSL1GHT="$PS3DEV"
          export PATH="$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          echo "PS3DEV=$PS3DEV"
          echo "PSL1GHT=$PSL1GHT"
          ls -la "$PS3DEV/ppu/bin" | head -45 || true
          ls -la "$PS3DEV/bin" | head -45 || true
          echo "Compiler candidates:"
          command -v ppu-gcc || true
          command -v powerpc64-ps3-elf-gcc || true
          for compiler in ppu-gcc powerpc64-ps3-elf-gcc; do
            if command -v "$compiler" >/dev/null 2>&1; then "$compiler" --version | head -1; fi
          done
          command -v ppu-gcc >/dev/null 2>&1 || { echo "::error::ppu-gcc not on PATH"; exit 1; }
          cd src/PS2-PS3-Bringup-035-SOURCE
          make -j2 2>&1 | tee "$GITHUB_WORKSPACE/build035.log"
          echo "Available packaging tools:"
          find "$PS3DEV" -type f \( -iname '*pkg*' -o -name 'sfo.py' \) | head -35 || true
          make pkg 2>&1 | tee -a "$GITHUB_WORKSPACE/build035.log"
          test -s ps2emu_bringup_035.pkg || { echo "::error::PKG was not generated"; exit 1; }

      - name: Collect output
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts
          cp -f build035.log artifacts/ 2>/dev/null || true
          find src/PS2-PS3-Bringup-035-SOURCE -maxdepth 2 -type f \( -name '*.elf' -o -name '*.self' -o -name '*.pkg' -o -name '*.map' \) -exec cp -f '{}' artifacts/ \; 2>/dev/null || true
          cp -f PS2-PS3-Bringup-089-SOURCE.zip artifacts/ 2>/dev/null || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Emulator-Build-089
          path: artifacts/
          if-no-files-found: warn
